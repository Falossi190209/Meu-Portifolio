<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sistema TCC</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>

body{
    background:#f5f7fb;
}

/* HEADER */
.header-tcc{
    background: linear-gradient(90deg,#0d6efd,#0a58ca);
}

/* CARDS SEM ANIMAÇÃO */
.modulo-card{
    background:white;
    border-radius:12px;
    padding:20px;
    box-shadow:0 4px 10px rgba(0,0,0,.08);
    height:100%;
}

/* BOTÕES */
.btn-modulo{
    width:100%;
}

/* FOOTER */
footer{
    font-size:14px;
}

/* BOTÃO VOLTAR */
.voltar{
    margin:20px;
}

</style>

</head>

<body class="d-flex flex-column min-vh-100">

<!-- HEADER -->
<div class="container-fluid header-tcc text-white p-3">
    <h5 class="mb-0">
        Projeto TCC 2026
        <span class="badge bg-light text-dark">v1.0</span>
    </h5>
</div>

<!-- BOTÃO VOLTAR -->
<div class="voltar">
    <button class="btn btn-secondary" onclick="voltar()">
        ⬅ Voltar
    </button>
</div>

<!-- HERO -->
<div class="container-fluid text-center py-5 bg-light">
    <h1 class="fw-bold">Bem-vindo ao sistema</h1>
    <p class="text-muted">
        Painel administrativo desenvolvido com Bootstrap
    </p>
</div>

<!-- MODULOS -->
<div class="container py-4">
    <div class="row g-4">

        <!-- USUARIOS -->
        <div class="col-12 col-md-6 col-lg-4">
            <div class="modulo-card text-center">
                <i class="bi bi-person-circle fs-1 text-primary"></i>
                <h4 class="mt-2">Usuários</h4>
                <p class="text-muted">Gerenciamento de perfis e acessos</p>
                <button class="btn btn-primary btn-modulo">
                    Acessar
                </button>
            </div>
        </div>

        <!-- RELATORIOS -->
        <div class="col-12 col-md-6 col-lg-4">
            <div class="modulo-card text-center">
                <i class="bi bi-bar-chart-line fs-1 text-success"></i>
                <h4 class="mt-2">Relatórios</h4>
                <p class="text-muted">Visualização de dados e estatísticas</p>
                <button class="btn btn-success btn-modulo">
                    Acessar
                </button>
            </div>
        </div>

        <!-- CONFIGURACOES -->
        <div class="col-12 col-md-12 col-lg-4">
            <div class="modulo-card text-center">
                <i class="bi bi-gear fs-1 text-warning"></i>
                <h4 class="mt-2">Configurações</h4>
                <p class="text-muted">Ajustes do sistema</p>
                <button class="btn btn-warning btn-modulo">
                    Acessar
                </button>
            </div>
        </div>

    </div>
</div>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center p-3 mt-auto">
    Desenvolvido por Falossi © 2026
</footer>

<script>
function voltar(){
    window.location.href = "portifolio.html";
}
</script>

</body>
</html>
