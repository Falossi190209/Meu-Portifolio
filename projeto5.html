<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List Premium</title>

<style>

/* ===== FUNDO ===== */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #e3f2fd, #f5f5f5);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    transition: 0.3s;
}

/* DARK MODE */
body.dark {
    background: linear-gradient(135deg, #0f172a, #1e1e1e);
    color: white;
}

/* CARD PRINCIPAL */
.container {
    width: 90%;
    max-width: 450px;
    background: rgba(255,255,255,0.8);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    text-align: center;
    transition: 0.3s;
}

body.dark .container {
    background: rgba(30,30,30,0.7);
}

/* HEADER */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

/* BOTÃO VOLTAR */
.voltar {
    background: #ff9800;
    border: none;
    padding: 8px 12px;
    border-radius: 10px;
    cursor: pointer;
    color: white;
    font-weight: bold;
    transition: 0.3s;
}

.voltar:hover {
    transform: scale(1.05);
    background: #e68900;
}

/* TEMA */
#tema {
    padding: 8px 12px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: #1976d2;
    color: white;
}

/* INPUTS */
input {
    width: 90%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 10px;
    border: 1px solid #ccc;
    outline: none;
    transition: 0.2s;
}

input:focus {
    border-color: #1976d2;
    transform: scale(1.02);
}

/* BOTÃO ADD */
#add {
    width: 95%;
    padding: 10px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #4caf50, #2e7d32);
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

#add:hover {
    transform: scale(1.03);
}

/* LISTA */
ul {
    list-style: none;
    padding: 0;
    margin-top: 15px;
}

li {
    background: white;
    margin: 8px 0;
    padding: 12px;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}

li:hover {
    transform: scale(1.03);
}

body.dark li {
    background: #2a2a2a;
    color: white;
}

/* TOTAL */
#totalPontos {
    margin-top: 10px;
    font-weight: bold;
    color: #1976d2;
}

body.dark #totalPontos {
    color: #90caf9;
}

/* RELÓGIO */
#relogio {
    font-weight: bold;
}

</style>

</head>

<body>

<div class="container">

<header>

    <button class="voltar" onclick="voltar()">⬅ Voltar</button>

    <div id="relogio"></div>

    <button id="tema">Tema</button>

</header>

<h2>To-Do List</h2>

<input id="tarefa" placeholder="Digite uma tarefa">
<input id="pontos" type="number" placeholder="Pontos">

<button id="add">Adicionar</button>

<ul id="lista"></ul>

<p id="totalPontos">Total: 0</p>

</div>

<script>

// voltar
function voltar() {
    window.location.href = "portifolio.html";
}

// tema
document.getElementById("tema").onclick = () => {
    document.body.classList.toggle("dark");
};

// relógio
function relogio() {
    document.getElementById("relogio").innerText =
        new Date().toLocaleTimeString();
}
setInterval(relogio, 1000);
relogio();

// to-do
let total = 0;

document.getElementById("add").onclick = () => {

    const tarefa = document.getElementById("tarefa").value;
    const pontos = Number(document.getElementById("pontos").value);

    if (!tarefa || pontos <= 0) return;

    const li = document.createElement("li");
    li.innerText = `${tarefa} (${pontos} pts)`;
    li.dataset.pontos = pontos;

    li.onclick = () => {
        total -= Number(li.dataset.pontos);
        li.remove();
        atualizar();
    };

    document.getElementById("lista").appendChild(li);

    total += pontos;
    atualizar();

    document.getElementById("tarefa").value = "";
    document.getElementById("pontos").value = "";
};

function atualizar() {
    document.getElementById("totalPontos").innerText =
        "Total: " + total;
}

</script>

</body>
</html>
