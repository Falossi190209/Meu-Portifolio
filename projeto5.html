<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <header>

        <div id="relogio"></div>
        <button id="tema">Alterar Tema</button>

    </header>

    <!-- To Do List -->
    <div>
        <input id="tarefa" placeholder="Digite uma tarefa">
        <input id="pontos" type="number" placeholder="Pontos" min="1">
        <button id="add">Adicionar</button>
    </div>
    <small>Clique em um item para remover</small>
    <ul id="lista"></ul>
    <p id="totalPontos">Total de Pontos: 0</p>


    <script>
        // Dark Mode
        var botaoTema = document.getElementById("tema")

        botaoTema.addEventListener("click", alterarTema)

        function alterarTema() {
            botaoTema = document.body.classList.toggle("dark")
        }


        // Relógio

        var relogio = document.getElementById("relogio")

        function atualizarRelogio() {
            var agora = new Date()
            relogio.innerText = agora.toLocaleTimeString()
        }

        atualizarRelogio()
        setInterval(atualizarRelogio, 1000)




        // to-Do list
        var input = document.getElementById("tarefa")
        var inputPontos = document.getElementById("pontos")
        var botao = document.getElementById("add")
        var lista = document.getElementById("lista")
        var totalPontosElemento = document.getElementById("totalPontos")

        var totalPontos = 0

        botao.addEventListener("click", function () {
            var texto = input.value.trim()
            var pontos = Number(inputPontos.value)
            if (texto === "" || pontos <= 0) return

            // cria o li igual ao seu padrão
            var li = document.createElement("li")
            li.innerText = texto + " (" + pontos + " pts)"
            li.dataset.pontos = pontos   // guarda os pontos no próprio li
            lista.appendChild(li)

            totalPontos += pontos
            totalPontosElemento.innerText = "Total de Pontos: " + totalPontos


        })

        // remover tarefa
        lista.addEventListener("click", function (event) {
            if (event.target.tagName === "LI") {
                totalPontos -= Number(event.target.dataset.pontos)
                totalPontosElemento.innerText = "Total de Pontos: " + totalPontos
                event.target.remove()
            }
        })



    </script>
</body>




<style>
    /* Corpo */
    body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: aliceblue;
        color: #222;
        transition: background 0.3s, color 0.3s;
        text-align: center;
        padding: 20px;
    }

    /* Dark Mode */
    body.dark {
        background-color: #121212;
        color: #f4f4f4;
    }

    /* Header */
    header {
        width: 100%;
        height: 60px;
        background-color: rgb(197, 202, 197);
        display: flex;
        align-items: center;
        padding: 0 20px;
        justify-content: space-between;
        border-radius: 8px;
    }

    body.dark header {
        background-color: #1e1e1e;
    }

    /* Botão tema */
    #tema {
        width: 150px;
        height: 35px;
        cursor: pointer;
        border: none;
        border-radius: 6px;
        background-color: #1976d2;
        color: white;
        font-weight: bold;
        transition: 0.3s;
    }

    #tema:hover {
        background-color: #0d47a1;
    }

    /* Relógio */
    #relogio {
        width: 120px;
        height: 35px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        border: 2px solid #1976d2;
        font-weight: bold;
    }

    body.dark #relogio {
        border-color: #90caf9;
    }

    /* To-Do List Inputs e botão */
    #tarefa,
    #pontos {
        padding: 8px;
        width: 200px;
        font-size: 1em;
        border-radius: 6px;
        border: 1px solid #ccc;
        margin: 5px 5px 5px 0;
        outline: none;
    }

    body.dark #tarefa,
    body.dark #pontos {
        background-color: #1e1e1e;
        color: #f4f4f4;
        border: 1px solid #555;
    }

    #add {
        padding: 8px 16px;
        cursor: pointer;
        border: none;
        border-radius: 6px;
        background-color: #4caf50;
        color: white;
        font-weight: bold;
        transition: 0.3s;
    }

    #add:hover {
        background-color: #388e3c;
    }

    /* Lista de tarefas */
    #lista {
        margin-top: 20px;
        list-style: none;
        padding: 0;
        width: 320px;
        margin-left: auto;
        margin-right: auto;
    }

    #lista li {
        background-color: white;
        margin-bottom: 8px;
        padding: 10px;
        border-radius: 6px;
        cursor: pointer;
        border: 1px solid #ccc;
        transition: 0.2s;
    }

    #lista li:hover {
        background-color: #e0f7fa;
    }

    body.dark #lista li {
        background-color: #1e1e1e;
        border: 1px solid #555;
    }

    body.dark #lista li:hover {
        background-color: #333;
    }

    /* Pequeno texto */
    small {
        margin-top: 10px;
        color: #555;
        display: block;
    }

    /* Total de Pontos */
    #totalPontos {
        margin-top: 15px;
        font-weight: bold;
        font-size: 1.2em;
        color: #1976d2;
    }

    body.dark #totalPontos {
        color: #90caf9;
    }
</style>
</style>

</html>
